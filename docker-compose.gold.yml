version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: odoo_gold
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_test
    command: -- --database=odoo_gold --init=account --without-demo=False
    restart: unless-stopped

volumes:
  odoo-db:
